# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → select this repo. Render builds the Dockerfile and injects the env vars below.
services:
  - type: web
    name: truck-weather-router
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      # Render terminates TLS and redirects HTTP itself; HSTS is still sent by Django.
      - key: SECURE_SSL_REDIRECT
        value: "false"
      # Optional: demo mode replays recorded API responses (see README).
      - key: DEMO_MODE
        value: "false"
